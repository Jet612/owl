[project]
name = "owl"
version = "0.1.0"
description = "Backyard wildlife camera: Hailo animal detection, clip recording and a public API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.4",
    "open-clip-torch>=3.3.0",
    "picamera2>=0.3.37",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

# CPU-only PyTorch: the default aarch64 wheels bundle ~5 GB of CUDA libraries the Pi can't use.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
